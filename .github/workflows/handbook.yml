name: Handbook consistency
on:
  push:
    paths:
      - 'patturn-rebuild/**'
      - '.github/workflows/handbook.yml'
  pull_request:
    paths:
      - 'patturn-rebuild/**'
      - '.github/workflows/handbook.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: handbook-${{ github.ref }}
  cancel-in-progress: true
jobs:
  handbook:
    name: Checklist arithmetic and generated handbook
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: patturn-rebuild/requirements.txt
      - run: python -m pip install -r patturn-rebuild/requirements.txt
      - name: Test checklist validation
        run: python -m unittest discover -s patturn-rebuild -p 'test_*.py'
      - name: Validate arithmetic and regenerate HTML
        run: |
          python patturn-rebuild/check_checklist.py
          python patturn-rebuild/build_handbook.py
      - name: Require generated handbook to match committed sources
        run: git diff --exit-code -- patturn-rebuild/index.html
