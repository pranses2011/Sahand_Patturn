name: Quality and Windows compile
on:
  push:
    paths:
      - 'patturn-app/**'
      - '.github/workflows/quality.yml'
  pull_request:
    paths:
      - 'patturn-app/**'
      - '.github/workflows/quality.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  web:
    name: Tests and web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: patturn-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: patturn-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Report bundle size and roadmap budget (non-enforcing)
        run: |
          node scripts/bundle-report.mjs > bundle-report.json
          cat bundle-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: web-bundle-report
          path: patturn-app/bundle-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests (disabled and software WebGL)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-smoke-failure
          path: patturn-app/test-results/
          retention-days: 7
  windows:
    name: Windows compile and NSIS package (not installation test)
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: patturn-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: patturn-app/package-lock.json
      - name: Prepare stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            patturn-app/apps/desktop/src-tauri/target
          key: windows-rust-${{ hashFiles('patturn-app/apps/desktop/src-tauri/Cargo.toml', 'patturn-app/apps/desktop/src-tauri/Cargo.lock') }}
      - run: npm ci
      - run: npm run typecheck
      - name: Compile desktop executable, without installer or signing
        run: npm run desktop:check
      - uses: actions/upload-artifact@v4
        with:
          name: windows-compile-check
          if-no-files-found: error
          retention-days: 7
          path: |
            patturn-app/apps/desktop/src-tauri/target/release/patturn-desktop.exe
            patturn-app/apps/desktop/src-tauri/Cargo.lock
      - name: Build unsigned NSIS test installer
        run: npm run desktop:installer
      - name: Generate checksums and test guide
        run: npm run installer:checksums
      - uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-test
          if-no-files-found: error
          retention-days: 7
          path: |
            patturn-app/apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            patturn-app/apps/desktop/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
            patturn-app/apps/desktop/src-tauri/target/release/bundle/nsis/README-WINDOWS-TEST.txt
            patturn-app/apps/desktop/src-tauri/target/release/bundle/nsis/build-info.json
